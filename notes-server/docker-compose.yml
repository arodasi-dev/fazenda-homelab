services:
  # Deixa o servidor da fazenda LER os containers, sem dar acesso ao Docker inteiro.
  fazenda-docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: fazenda-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      # Somente leitura. Só mude para 1 se quiser reiniciar containers pelo app
      # (veja "Reiniciar pelo app" no README: isso dá mais poder ao proxy).
      POST: ${ENABLE_RESTART:-0}
      ALLOW_RESTARTS: ${ENABLE_RESTART:-0}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:2375:2375"

  fazenda-notas:
    build: .
    container_name: fazenda-notas
    restart: unless-stopped
    # Rede do próprio servidor: assim a leitura de rede (/proc/net/dev) é a do servidor.
    network_mode: host
    environment:
      NOTES_TOKEN: ${NOTES_TOKEN:?crie o arquivo .env com NOTES_TOKEN (veja .env.example)}
      ALLOWED_ORIGIN: https://arodasi-dev.github.io
      HOST: 127.0.0.1        # o acesso de fora é pelo "tailscale serve" (HTTPS)
      PORT: "8787"
      DOCKER_HOST: http://127.0.0.1:2375
      ENABLE_RESTART: ${ENABLE_RESTART:-0}
      # crédito da API da Anthropic (opcional)
      ANTHROPIC_ADMIN_KEY: ${ANTHROPIC_ADMIN_KEY:-}
      CREDIT_TOTAL_USD: ${CREDIT_TOTAL_USD:-0}
      CREDIT_SINCE: ${CREDIT_SINCE:-}
      # gasto da secretária (lido do banco dela, somente leitura)
      SECRETARIA_BUDGET_USD: ${SECRETARIA_BUDGET_USD:-1.5}
      SECRETARIA_PRICE_IN_PER_MTOK: ${SECRETARIA_PRICE_IN_PER_MTOK:-1.0}
      SECRETARIA_PRICE_OUT_PER_MTOK: ${SECRETARIA_PRICE_OUT_PER_MTOK:-5.0}
      SECRETARIA_CREDIT_USD: ${SECRETARIA_CREDIT_USD:-0}
      SECRETARIA_CREDIT_FROM: ${SECRETARIA_CREDIT_FROM:-}
    volumes:
      - ./notas:/data
      # pasta "data" da secretária (ex.: /home/isadora/secretaria/data); sem isso fica desligado
      - ${SECRETARIA_DATA:-./vazio}:/secretaria:ro
    depends_on:
      - fazenda-docker-proxy
