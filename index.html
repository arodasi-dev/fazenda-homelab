<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Fazenda Homelab</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
html,body{height:100%;overflow:hidden;background:#4a9d62;font-family:"Trebuchet MS",system-ui,sans-serif;color:#5a3a22;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;touch-action:none}
canvas#cv{position:fixed;inset:0;image-rendering:pixelated;cursor:grab;touch-action:none}
canvas#cv.drag{cursor:grabbing}
.box{position:fixed;background:#fdf3d8;border:3px solid #8a5a3a;border-radius:8px;box-shadow:0 3px 0 #5a3a22;padding:8px 10px;font-size:13px}
#plate{position:fixed;top:calc(10px + var(--sat));left:50%;transform:translateX(-50%);background:#fdf3d8;border:3px solid #8a5a3a;border-radius:10px;box-shadow:0 3px 0 #5a3a22;padding:6px 26px;font-weight:bold;font-size:20px;letter-spacing:1px;white-space:nowrap}
#stats{top:calc(10px + var(--sat));left:calc(10px + var(--sal));width:210px}
#stats .bar,#info .bar{height:10px;background:#e4d3a8;border:2px solid #8a5a3a;border-radius:6px;overflow:hidden;margin:2px 0 6px}
#stats .bar i,#info .bar i{display:block;height:100%;transition:width .5s}
#quests{top:calc(10px + var(--sat));right:calc(10px + var(--sar));width:220px}
#quests h4,#info h4{font-size:14px;margin-bottom:4px}
.q{font-size:12px;margin:3px 0}
.q.done{text-decoration:line-through;opacity:.6}
#qbtn{display:none}
#info{left:calc(10px + var(--sal));bottom:calc(84px + var(--sab));width:250px}
#info.hidden{display:none}
#info button{background:#ffd98a;border:2px solid #8a5a3a;border-radius:6px;padding:6px 10px;margin:3px 3px 0 0;cursor:pointer;color:#5a3a22;font-weight:bold;font-size:13px}
#info button:active{background:#ffe9b5}
#hotbar{position:fixed;bottom:calc(10px + var(--sab));left:50%;transform:translateX(-50%);display:flex;gap:4px;background:#fdf3d8;border:3px solid #8a5a3a;border-radius:10px;padding:4px;box-shadow:0 3px 0 #5a3a22}
.slot{width:54px;height:54px;border:2px solid #b98355;border-radius:6px;background:#f3e2b3;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;font-size:24px}
.slot:active{background:#fff4cc;border-color:#8a5a3a}
.slot span{position:absolute;top:1px;left:4px;font-size:10px;font-weight:bold}
.slot small{font-size:9px;line-height:1}
#help{position:fixed;left:calc(10px + var(--sal));bottom:calc(10px + var(--sab));font-size:11px;max-width:230px;opacity:.95}
#zoom{position:fixed;right:calc(10px + var(--sar));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px}
#zoom button{width:38px;height:38px;font-size:20px;font-weight:bold;background:#fdf3d8;border:3px solid #8a5a3a;border-radius:8px;box-shadow:0 3px 0 #5a3a22;cursor:pointer;color:#5a3a22}
#zoom button:active{transform:translateY(2px);box-shadow:0 1px 0 #5a3a22}
#toasts{position:fixed;top:calc(56px + var(--sat));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:92vw}
.toast{background:#fffbe9;border:3px solid #8a5a3a;border-radius:8px;padding:5px 12px;font-size:13px;box-shadow:0 3px 0 #5a3a22;animation:fade 3.6s forwards;text-align:center}
@keyframes fade{0%{opacity:0;transform:translateY(-6px)}8%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#joy{position:fixed;left:calc(18px + var(--sal));bottom:calc(88px + var(--sab));width:128px;height:128px;border-radius:50%;background:rgba(253,243,216,.45);border:3px solid rgba(138,90,58,.7);display:none;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:#fdf3d8;border:3px solid #8a5a3a;box-shadow:0 3px 0 #5a3a22}
body.touch #joy{display:block}
body.touch #help{display:none}
@media (max-width:640px){
 #plate{display:none}
 #stats{width:158px;padding:6px 8px;font-size:12px}
 #stats .hide-s{display:none}
 #quests{display:none;top:calc(70px + var(--sat));right:calc(10px + var(--sar))}
 #quests.open{display:block}
 #qbtn{display:flex;position:fixed;top:calc(10px + var(--sat));right:calc(10px + var(--sar));width:44px;height:44px;align-items:center;justify-content:center;font-size:22px;background:#fdf3d8;border:3px solid #8a5a3a;border-radius:10px;box-shadow:0 3px 0 #5a3a22}
 #hotbar{left:calc(8px + var(--sal));right:calc(8px + var(--sar));transform:none;padding:3px;gap:3px}
 .slot{flex:1;width:auto;height:50px;font-size:21px}
 #info{left:calc(10px + var(--sal));right:calc(10px + var(--sar));width:auto;bottom:auto;top:calc(108px + var(--sat))}
 #zoom{top:auto;bottom:calc(74px + var(--sab));transform:none;flex-direction:row}
 #toasts{top:auto;bottom:calc(220px + var(--sab))}
 #joy{bottom:calc(76px + var(--sab));width:116px;height:116px}
}
#ver{font-size:10px;opacity:.75;margin-top:2px;cursor:pointer;text-decoration:underline dotted}
#notes{position:fixed;inset:0;z-index:50;background:rgba(40,30,20,.55);display:flex;align-items:center;justify-content:center;padding:calc(10px + var(--sat)) 10px calc(10px + var(--sab))}
#notes.hidden{display:none}
#notes,#notes *{touch-action:pan-y;user-select:text;-webkit-user-select:text}
#np{position:relative;width:min(820px,100%);height:min(560px,100%);display:flex;flex-direction:column;padding:10px}
#nh{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
#nh b{font-size:16px}
#nstat{flex:1;font-size:11px;opacity:.85;min-width:140px}
#np button{background:#ffd98a;border:2px solid #8a5a3a;border-radius:6px;padding:6px 10px;cursor:pointer;color:#5a3a22;font-weight:bold;font-size:13px}
#np button:active{background:#ffe9b5}
#ncfgbox{background:#f3e2b3;border:2px solid #b98355;border-radius:8px;padding:8px;margin-bottom:8px;font-size:12px}
#ncfgbox.hidden{display:none}
#ncfgbox input{width:100%;margin:3px 0 6px}
#nbody{flex:1;display:flex;gap:10px;min-height:0}
#nlist{width:200px;overflow:auto;border:2px solid #b98355;border-radius:8px;background:#f8ecc8;padding:4px}
.nitem{padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px;display:flex;flex-direction:column}
.nitem small{opacity:.65;font-size:10px}
.nitem.on{background:#ffd98a}
.nempty{padding:14px;font-size:12px;text-align:center;opacity:.8}
#ned{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
#np input,#np textarea{font-family:inherit;font-size:16px;color:#5a3a22;background:#fffbe9;border:2px solid #b98355;border-radius:8px;padding:8px;outline:none}
#np input:focus,#np textarea:focus{border-color:#8a5a3a}
#ntext{flex:1;resize:none}
@media (max-width:640px){#nbody{flex-direction:column}#nlist{width:auto;height:110px;flex:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="plate">🌾 Fazenda Homelab</div>

<div class="box" id="stats">
  <b>Nv <span id="s-lv">3</span></b> · 🪙 <span id="s-coin">120</span> · ⏱ <span id="s-up">23d</span>
  <div class="bar" title="XP"><i id="s-xp" style="background:#f6b93b"></i></div>
  <div style="font-size:11px">⚡ <span id="s-cpu"></span>% · 🧠 <span id="s-ram"></span>%</div>
  <div class="bar hide-s"><i id="b-cpu" style="background:#e67e22"></i></div>
  <div class="bar hide-s"><i id="b-ram" style="background:#3498db"></i></div>
  <div style="font-size:11px">🥕 <span id="s-dsk"></span>% · 🦆 <span id="s-net"></span> Mb/s</div>
  <div id="ver" title="Toque para buscar a versão mais nova">🏷️ v… ↻</div>
  <div id="dbg" style="font-size:9px;opacity:.6;font-family:monospace"></div>
</div>

<div id="qbtn">📜</div>
<div class="box" id="quests"><h4>📜 Missões do dia</h4><div id="qlist"></div></div>

<div class="box hidden" id="info">
  <h4 id="i-name"></h4>
  <div id="i-role" style="font-size:12px;margin-bottom:4px"></div>
  <div id="i-body"></div>
  <div id="i-btns"></div>
</div>

<div id="zoom"><button id="zi" title="Zoom +">+</button><button id="zo" title="Zoom -">−</button><button id="zf" title="Seguir personagem">◎</button></div>
<div class="box" id="help">🕹️ <b>WASD/setas</b> andar · <b>arrastar</b> mover o mapa · <b>roda</b> zoom · <b>clique</b> num bicho/prédio · <b>E</b> interagir · <b>N</b> dia/noite · <b>F</b> seguir</div>
<div id="joy"><i></i></div>
<div id="hotbar"></div>
<div id="notes" class="hidden">
 <div class="box" id="np">
  <div id="nh"><b>💡 Ideias de novos apps</b><span id="nstat"></span><button id="ncfg" title="Servidor de notas">⚙️</button><button id="nx" title="Fechar">✖</button></div>
  <div id="ncfgbox" class="hidden">
   <b>Servidor de notas</b> (a pasta no seu homeserver)
   <input id="cfgurl" type="url" placeholder="https://meuservidor.tailnet.ts.net" autocapitalize="off" autocorrect="off" spellcheck="false">
   <input id="cfgtoken" type="password" placeholder="Token" autocapitalize="off" autocorrect="off" spellcheck="false">
   <button id="csave">Salvar</button> <button id="ctest">Testar conexão</button>
  </div>
  <div id="nbody">
   <div id="nlist"></div>
   <div id="ned">
    <input id="ntitle" placeholder="Nome da ideia (ex.: Bot de lembretes)" maxlength="80">
    <textarea id="ntext" placeholder="Descreva sua ideia de app para o servidor…"></textarea>
    <div><button id="nsave">💾 Salvar</button> <button id="nnew">＋ Nova</button> <button id="ndel">🗑️ Apagar</button></div>
   </div>
  </div>
 </div>
</div>
<div id="toasts"></div>

<script>
'use strict';
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const WW=1024,WH=640;
const isTouch=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window;
if(isTouch)document.body.classList.add('touch');
if(!ctx.roundRect)ctx.roundRect=function(x,y,w,h){this.rect(x,y,w,h);};
let lastErr='',errN=0;
let dpr=Math.min(2,Math.max(1,window.devicePixelRatio||1)),VW=0,VH=0;
function resize(){VW=innerWidth;VH=innerHeight;cv.width=Math.round(VW*dpr);cv.height=Math.round(VH*dpr);cv.style.width=VW+'px';cv.style.height=VH+'px';}
addEventListener('resize',resize);resize();
['gesturestart','gesturechange','gestureend'].forEach(n=>document.addEventListener(n,e=>e.preventDefault()));
document.addEventListener('touchmove',e=>{if(!e.target.closest('#notes'))e.preventDefault();},{passive:false});

function mkrng(s){return()=>((s=(s*1664525+1013904223)>>>0)/4294967296);}
const rnd=mkrng(11);
const rr=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- utilitários de desenho (unidades "D" = meio pixel do mundo) ---------- */
const hxm={};
function hx(s){if(hxm[s])return hxm[s];const v=parseInt(s.slice(1),16);return hxm[s]=[v>>16&255,v>>8&255,v&255];}
const toHex=a=>'#'+a.map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');
const shd=(s,k)=>toHex(hx(s).map(v=>v*k));
const mixc=(a,b,t)=>toHex(hx(a).map((v,i)=>v+(hx(b)[i]-v)*t));
function R(c,x,y,w,h,col){w=Math.round(w);h=Math.round(h);if(w<=0||h<=0)return;c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),w,h);}
function ell(c,cx,cy,rx,ry,col){for(let y=-ry;y<=ry;y++){const k=1-(y/ry)**2;if(k<0)continue;const w=Math.round(rx*Math.sqrt(k));R(c,cx-w,cy+y,w*2,1,col);}}
function vgrad(c,x,y,w,h,c1,c2){for(let i=0;i<h;i++)R(c,x,y+i,w,1,mixc(c1,c2,h>1?i/(h-1):0));}
function planks(c,x,y,w,h,base,pw){vgrad(c,x,y,w,h,base,shd(base,.8));for(let px=x+pw;px<x+w-1;px+=pw)R(c,px,y,1,h,shd(base,.68));R(c,x,y,2,h,shd(base,1.2));R(c,x+w-2,y,2,h,shd(base,.7));}
function gable(c,x,y,w,h,c1,c2,dk,lt){
 for(let i=0;i<h;i++){const half=(w/2)*((i+1)/h);const L=Math.round(x+w/2-half),Rr=Math.round(x+w/2+half);
  R(c,L,y+i,Rr-L,1,mixc(c1,c2,i/h));
  if(i%6===5)R(c,L,y+i,Rr-L,1,dk);else for(let px=L+((Math.floor(i/6)%2)*5)+2;px<Rr-1;px+=10)R(c,px,y+i,1,1,dk);
  R(c,L,y+i,2,1,lt);R(c,Rr-2,y+i,2,1,dk);}
 R(c,x+w/2-2,y,4,2,lt);
}
function eave(c,x,y,w){R(c,x+4,y,w-8,3,'rgba(30,20,10,.3)');}
function win(c,x,y,w,h){R(c,x-2,y-2,w+4,h+4,'#fff6e6');R(c,x-3,y+h+2,w+6,2,'#cdbd98');vgrad(c,x,y,w,h,'#a6dcf8','#5aa9dc');R(c,x+w/2-1,y,2,h,'#fff6e6');R(c,x,y+h/2-1,w,2,'#fff6e6');R(c,x+2,y+2,3,Math.max(2,h/2-5),'rgba(255,255,255,.55)');}
function sprite(w,h,fn){const c=document.createElement('canvas');c.width=w+PAD*2;c.height=h+PAD*2;const x=c.getContext('2d');x.translate(PAD,PAD);fn(x,w,h);return c;}
const PAD=16;

/* ---------- mundo ---------- */
const B=[
 {id:'house',name:'Casa (Servidor)',role:'O coração da fazenda: o servidor em si',type:'house',x:464,y:112,w:64,h:56,meta:true},
 {id:'jellyfin',name:'Jellyfin',role:'Celeiro de filmes e séries',type:'barn',x:150,y:224,w:64,h:64,animal:'cow',n:2,pen:{x:222,y:208,w:120,h:80,gap:'s'}},
 {id:'immich',name:'Immich',role:'Galinheiro das fotos (põe ovos!)',type:'coop',x:110,y:346,w:44,h:36,animal:'chicken',n:4,pen:{x:160,y:336,w:100,h:84,gap:'n'}},
 {id:'sonarr',name:'Sonarr',role:'Chiqueiro dos downloads',type:'sty',x:290,y:346,w:36,h:30,animal:'pig',n:2,pen:{x:334,y:336,w:90,h:76,gap:'n'}},
 {id:'pihole',name:'Pi-hole',role:'Cachorro de guarda: bloqueia os anúncios',type:'dog',x:436,y:336,w:28,h:24,animal:'dog',n:1,zone:{x:428,y:326,w:60,h:84}},
 {id:'vaultwarden',name:'Vaultwarden',role:'Cofre das senhas, vigiado pelas ovelhas',type:'shed',x:570,y:336,w:40,h:36,animal:'sheep',n:3,pen:{x:618,y:330,w:110,h:84,gap:'n'}},
 {id:'kuma',name:'Uptime Kuma',role:'Moinho que vigia tudo',type:'mill',x:760,y:184,w:36,h:100},
 {id:'field',name:'Horta (Disco)',role:'Quanto mais cheia, mais disco usado',type:'field',x:440,y:440,w:128,h:96,meta:true},
 {id:'pond',name:'Lago (Rede)',role:'As ondas mostram o tráfego de rede',type:'pond',x:770,y:430,w:140,h:80,meta:true},
 {id:'ideas',name:'Terreno secreto',role:'Ainda bloqueado: plante aqui suas ideias de apps',type:'clouds',x:610,y:60,w:120,h:86,meta:true}
];
B.forEach(b=>{b.state='up';b.cpu=rr(5,40);b.ram=rr(20,60);b.cpuT=b.cpu;b.since=Date.now()-rr(2,20)*86400000;b.ang=0;});
const house=B[0],POND={cx:840,cy:470,rx:68,ry:38};
const PATHS=[[488,168,16,148],[100,300,780,16],[174,288,16,12],[770,284,16,16],[272,288,20,12],[168,316,16,30],[318,316,16,30],[580,316,16,22],[488,316,16,124],[832,316,16,96],[204,316,20,20],[370,316,20,20],[662,316,20,16]];
const inPath=(x,y)=>PATHS.some(p=>x>=p[0]&&x<p[0]+p[2]&&y>=p[1]&&y<p[1]+p[3]);

const solids=[];
B.forEach(b=>{if(b.type==='clouds'){solids.push({x:b.x+8,y:b.y+14,w:b.w-16,h:b.h-20});return;}if(b.meta&&b.type!=='house')return;solids.push({x:b.x+2,y:b.y+b.h*0.45,w:b.w-4,h:b.h*0.55});});

/* ---------- sprites dos prédios (alto detalhe) ---------- */
function dHouse(c,W,H){
 R(c,8,H-10,W-16,10,'#9a9a9a');R(c,8,H-10,W-16,2,'#bcbcbc');for(let x=14;x<W-16;x+=12)R(c,x,H-8,1,8,'#7f7f7f');
 vgrad(c,8,48,W-16,H-58,'#f9f0dc','#e0d1ae');
 R(c,8,48,4,H-58,'#7a4a2a');R(c,W-12,48,4,H-58,'#7a4a2a');R(c,8,78,W-16,4,'#7a4a2a');R(c,W/2-2,48,4,30,'#7a4a2a');
 for(let i=0;i<12;i++){R(c,12+i,48+i,3,2,'#7a4a2a');R(c,W-15-i,48+i,3,2,'#7a4a2a');}
 win(c,22,58,22,14);win(c,W-44,58,22,14);
 [22,W-44].forEach(x=>{R(c,x-3,74,28,5,'#8a5a3a');R(c,x-3,74,28,1,'#a47046');for(let k=0;k<6;k++){R(c,x+k*4,71,3,3,['#ff8fb8','#ffe066','#fff'][k%3]);R(c,x+1+k*4,73,2,1,'#3f9b4f');}});
 const dx=W/2-14,dy=H-10-46;
 R(c,dx-3,dy-3,34,49,'#5a3a22');vgrad(c,dx,dy,28,46,'#b57a4a','#8f5c36');for(let px=dx+7;px<dx+28;px+=7)R(c,px,dy,1,46,'#7a4a2a');
 R(c,dx+8,dy+6,12,12,'#fff6e6');R(c,dx+9,dy+7,10,10,'#7cc4f0');R(c,dx+13,dy+7,2,10,'#fff6e6');R(c,dx+9,dy+11,10,2,'#fff6e6');
 R(c,dx+22,dy+26,3,3,'#f2d36b');R(c,dx-6,H-7,40,3,'#d0d0d0');R(c,dx-9,H-4,46,4,'#bdbdbd');
 gable(c,-8,0,W+16,50,'#c0654c','#8f3d38','#7a3230','#dc866c');
 for(let i=13;i<46;i++){const half=((W+16)/2)*((i+1)/50)-13;if(half<=0)continue;R(c,W/2-half,i,half*2,1,i<20?'#f6ecd6':mixc('#f6ecd6','#e6d8b4',(i-20)/26));}
 R(c,W/2-2,14,4,32,'#7a4a2a');R(c,W/2-26,42,52,3,'#7a4a2a');
 for(let i=0;i<14;i++){R(c,W/2-3-i,26+i,3,2,'#7a4a2a');R(c,W/2+i,26+i,3,2,'#7a4a2a');}
 R(c,W/2-6,22,12,10,'#fff6e6');R(c,W/2-5,23,10,8,'#7cc4f0');R(c,W/2-1,23,2,8,'#fff6e6');
 R(c,-8,47,W+16,4,'#8f3d38');R(c,-8,47,W+16,1,'#dc866c');eave(c,-8,51,W+16);
 const cx=W/2+22;R(c,cx,2,14,26,'#a49a90');for(let y=6;y<28;y+=6)R(c,cx,y,14,1,'#7f766d');R(c,cx,2,2,26,'#c2b9ae');R(c,cx-2,0,18,4,'#6e6660');R(c,cx-2,0,18,1,'#8a8279');
}

 else{const st={up:'🟢 Online',down:'🔴 Fora do ar',restarting:'🟡 Reiniciando'}[sel.state];
  const days=Math.floor((Date.now()-sel.since)/86400000);
  h=`<div style="font-size:12px;margin-bottom:4px">${st} · ${days}d de uptime</div>`+bar('⚡ CPU',sel.cpu,'#e67e22')+bar('🧠 RAM',sel.ram,'#3498db');}
 document.getElementById('i-body').innerHTML=h;
 if(full){const bt=document.getElementById('i-btns');
  bt.innerHTML=isSvc(sel)?'<button onclick="act(2)">🔄 Reiniciar</button><button onclick="act(3)">📜 Logs</button><button onclick="act(5)">⬆️ Atualizar</button>':sel.type==='house'?'<button onclick="act(4)">💾 Backup</button><button onclick="act(6)">🧹 Limpar</button>':sel.type==='field'?'<button onclick="act(6)">🧹 Limpar disco</button>':'';
  bt.innerHTML+='<button onclick="select(null)">✖</button>';}
}
function hud(){
 document.getElementById('dbg').textContent=`z${zoom.toFixed(2)} s${evenS()} ${VW}x${VH} d${dpr} c${cv.width}x${cv.height}`+(lastErr?' E:'+lastErr:'');
 const up=S.upBase+(Date.now()-S.t0)/1000,d=Math.floor(up/86400),h=Math.floor(up%86400/3600);
 const $=id=>document.getElementById(id);
 $('s-lv').textContent=lv;$('s-coin').textContent=coins;$('s-up').textContent=d+'d '+h+'h';
 $('s-xp').style.width=(xp/need()*100)+'%';
 $('s-cpu').textContent=Math.round(S.cpu);$('s-ram').textContent=Math.round(S.ram);$('s-dsk').textContent=Math.round(S.dsk);$('s-net').textContent=Math.round(S.net);
 $('b-cpu').style.width=S.cpu+'%';$('b-ram').style.width=S.ram+'%';
 $('qlist').innerHTML=quests.map(q=>`<div class="q ${q.done?'done':''}">${q.done?'☑':'☐'} ${q.t}${q.goal?` (${Math.min(q.n,q.goal)}/${q.goal})`:''}</div>`).join('');
 renderInfo(false);
}
setInterval(hud,500);hud();
setInterval(()=>{S.dsk=Math.min(95,S.dsk+Math.random()*0.4);},4000);

/* ---------- ideias de apps (notas) ---------- */
const APP_VERSION='1.3.2',APP_DATE='24/10/2026';
const NK='fazenda.notes.v1',CK='fazenda.cfg.v1';
let notes=[],pendDel=[],cfg={url:'',token:''},curId=null,notesOpen=false,syncing=false;
(function(){try{const j=JSON.parse(localStorage.getItem(NK)||'{}');notes=j.notes||[];pendDel=j.pendDel||[];}catch(e){}
 try{const c=JSON.parse(localStorage.getItem(CK)||'{}');cfg={url:c.url||'',token:c.token||''};}catch(e){}})();
const persist=()=>{try{localStorage.setItem(NK,JSON.stringify({notes,pendDel}));}catch(e){}};
const $n=id=>document.getElementById(id);
const newest=()=>[...notes].sort((a,b)=>b.updated.localeCompare(a.updated));
function setStat(k,extra){const m={ok:'☁️✅ Sincronizado com o servidor',local:'📱 Só neste aparelho (configure o servidor em ⚙️)',err:'⚠️ Servidor indisponível: salvo só aqui'+(extra?' ('+extra+')':''),sync:'🔄 Sincronizando…'};$n('nstat').textContent=m[k];}
async function api(path,method='GET',body){
 const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),8000);
 try{const r=await fetch(cfg.url.replace(/\/+$/,'')+path,{method,signal:ctl.signal,headers:{'Authorization':'Bearer '+cfg.token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  if(!r.ok)throw new Error('HTTP '+r.status);return r.status===204?null:await r.json();}
 finally{clearTimeout(to);}
}
async function syncNotes(){
 if(!cfg.url||!cfg.token){setStat('local');return;}
 if(syncing)return;syncing=true;setStat('sync');
 try{
  for(const id of [...pendDel]){await api('/notes/'+encodeURIComponent(id),'DELETE');pendDel=pendDel.filter(x=>x!==id);}
  const remote=await api('/notes');const rmap=new Map(remote.map(n=>[n.id,n]));
  for(const rn of remote){if(pendDel.includes(rn.id))continue;const ln=notes.find(n=>n.id===rn.id);
   if(!ln)notes.push({id:rn.id,title:rn.title,text:rn.text,updated:rn.updated,synced:true});
   else if(rn.updated>ln.updated)Object.assign(ln,{title:rn.title,text:rn.text,updated:rn.updated,synced:true});}
  for(const ln of notes){const rn=rmap.get(ln.id);if(!ln.synced||!rn){await api('/notes/'+encodeURIComponent(ln.id),'PUT',{title:ln.title,text:ln.text,updated:ln.updated});ln.synced=true;}}
  persist();renderNotes();setStat('ok');
 }catch(e){setStat('err',e.name==='AbortError'?'tempo esgotado':e.message);}
 finally{syncing=false;}
}
function renderNotes(){
 const l=$n('nlist');l.innerHTML='';
 if(!notes.length){l.innerHTML='<div class="nempty">Nenhuma ideia ainda.<br>Escreva a primeira ao lado 🌱</div>';return;}
 newest().forEach(n=>{const d=document.createElement('div');d.className='nitem'+(n.id===curId?' on':'');d.innerHTML='<b></b><small></small>';
  d.firstChild.textContent=(n.synced?'':'● ')+n.title;d.lastChild.textContent=new Date(n.updated).toLocaleDateString('pt-BR');d.onclick=()=>loadNote(n.id);l.appendChild(d);});
}
function loadNote(id){const n=notes.find(n=>n.id===id);curId=n?id:null;$n('ntitle').value=n?n.title:'';$n('ntext').value=n?n.text:'';renderNotes();}
function newNote(){curId=null;$n('ntitle').value='';$n('ntext').value='';renderNotes();$n('ntitle').focus();}
function saveNote(){
 let title=$n('ntitle').value.trim();const text=$n('ntext').value.trim();
 if(!title&&!text){toast('Escreva alguma coisa primeiro 🙂');return;}
 if(!title)title=text.split('\n')[0].slice(0,60);
 let n=notes.find(x=>x.id===curId);const isNew=!n;
 if(!n){n={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6)};notes.push(n);curId=n.id;}
 Object.assign(n,{title,text,updated:new Date().toISOString(),synced:false});
 persist();renderNotes();
 if(isNew){addXP(20,'💡 Ideia plantada!');quest('idea');}else toast('💾 Ideia salva');
 syncNotes();
}
function delNote(){const n=notes.find(x=>x.id===curId);if(!n)return;if(!confirm('Apagar esta ideia?'))return;
 notes=notes.filter(x=>x!==n);if(cfg.url)pendDel.push(n.id);persist();newNote();syncNotes();}
function openNotes(){notesOpen=true;for(const k in keys)keys[k]=false;joyEnd();resetPtrs();
 $n('notes').classList.remove('hidden');$n('cfgurl').value=cfg.url;$n('cfgtoken').value=cfg.token;
 renderNotes();if(notes.length&&!curId)loadNote(newest()[0].id);syncNotes();}
function closeNotes(){notesOpen=false;$n('notes').classList.add('hidden');if(document.activeElement)document.activeElement.blur();}
$n('nx').onclick=closeNotes;
$n('notes').addEventListener('pointerdown',e=>{if(e.target===$n('notes'))closeNotes();});
$n('nsave').onclick=saveNote;$n('nnew').onclick=newNote;$n('ndel').onclick=delNote;
$n('ncfg').onclick=()=>$n('ncfgbox').classList.toggle('hidden');
$n('csave').onclick=()=>{cfg={url:$n('cfgurl').value.trim().replace(/\/+$/,''),token:$n('cfgtoken').value.trim()};
 try{localStorage.setItem(CK,JSON.stringify(cfg));}catch(e){}toast('⚙️ Servidor salvo');syncNotes();};
$n('ctest').onclick=async()=>{cfg={url:$n('cfgurl').value.trim().replace(/\/+$/,''),token:$n('cfgtoken').value.trim()};
 if(!cfg.url||!cfg.token){toast('Preencha a URL e o token.');return;}
 try{const r=await api('/notes');toast('✅ Conectado! '+r.length+' ideia(s) no servidor.');}catch(e){toast('❌ Falhou: '+(e.name==='AbortError'?'tempo esgotado':e.message));}};
// versão e atualização forçada
$n('ver').textContent='🏷️ v'+APP_VERSION+' ↻';$n('ver').title='Versão '+APP_VERSION+' ('+APP_DATE+'). Toque para buscar a versão mais nova.';
$n('ver').onclick=async()=>{toast('🔄 Buscando versão nova…');
 try{const rs=navigator.serviceWorker?await navigator.serviceWorker.getRegistrations():[];for(const r of rs)await r.unregister();for(const k of await caches.keys())await caches.delete(k);}catch(e){}
 location.reload();};

let last=performance.now();
function loop(ts){
 requestAnimationFrame(loop);
 const dt=Math.min(0.05,(ts-last)/1000);last=ts;const t=ts/1000;
 try{
  if(Math.abs(innerWidth-VW)>1||Math.abs(innerHeight-VH)>1)resize();
  update(dt,t);draw(t);
 }catch(e){
  lastErr=(e&&e.message||String(e)).slice(0,60);
  if(++errN===1||errN%120===0)toast('⚠️ erro: '+lastErr);
  if(errN%30===1){zoom=zoomT=3;follow=true;ctx.setTransform(1,0,0,1,0,0);}
 }
}
requestAnimationFrame(loop);
setTimeout(()=>toast(isTouch?'👋 Bem-vinda! Use o joystick e toque nos bichos.':'👋 Bem-vinda! Ande com WASD e clique nos bichos.'),600);
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
 const had=!!navigator.serviceWorker.controller;let reloaded=false,reg=null;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!reloaded){reloaded=true;location.reload();}});
 navigator.serviceWorker.register('sw.js').then(r=>{reg=r;r.update();}).catch(()=>{});
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&reg)reg.update().catch(()=>{});});
}
</script>
